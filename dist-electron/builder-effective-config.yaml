directories:
  output: dist-electron
  buildResources: build
appId: com.absensholat.desktop
files:
  - filter:
      - dist/**/*
      - electron/**/*
mac:
  target:
    - target: dmg
      arch:
        - universal
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: nsis
      arch:
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  buildUniversalInstaller: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
electronVersion: 42.1.0
