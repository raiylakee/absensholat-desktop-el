name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. 1.2.3) — leave blank to auto-bump'
        required: false
        type: string
      bump:
        description: 'Bump type (ignored when version is set)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            current=$(node -p "require('./package.json').version")
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) new="$((major + 1)).0.0" ;;
              minor) new="${major}.$((minor + 1)).0" ;;
              *)     new="${major}.${minor}.$((patch + 1))" ;;
            esac
            echo "version=$new" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in package.json
        run: |
          V="${{ steps.ver.outputs.version }}"
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '$V';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v${{ steps.ver.outputs.version }}"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin HEAD --tags

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS - universal (arm64 + x64)
          - os: macos-latest
            platform: mac
            arch: universal
          # Windows x64
          - os: windows-latest
            platform: win
            arch: x64
          # Windows arm64
          - os: windows-latest
            platform: win
            arch: arm64
          # Linux x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          # Linux arm64
          - os: ubuntu-latest
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: npm

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_BASE_URL: https://absensholat-api.vercel.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.zip
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.AppImage
            dist-electron/*.deb
            dist-electron/*.rpm
            dist-electron/*.snap
          if-no-files-found: ignore

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: |
            ## What's Changed

            See commits for details.

            ---
            **Downloads**
            | Platform | Architecture | Installer |
            |----------|-------------|-----------|
            | Windows  | x64         | `.msi` |
            | Windows  | arm64       | `.msi` |
            | macOS    | Universal   | `.dmg` (arm64 + x64) |
            | Linux    | x64         | `.deb`, `.rpm`, `.AppImage` |
            | Linux    | arm64       | `.deb`, `.rpm`, `.AppImage` |
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
